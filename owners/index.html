<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Red Mascotera - Dueños</title>
    <!-- CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/css/tabler.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/2.1.4/css/dataTables.dataTables.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Page -->
    <div class="page">
      <!-- Navbar -->
      <header class="navbar navbar-expand-sm navbar-light d-print-none">
        <div class="container-xl">
          <h1
            class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3"
          >
            <img
              src="../assets/images/icon-dog.svg"
              alt="Dog Icon"
              width="24"
              height="24"
            />
            <span class="ps-2" href="#">Red Mascotera</span>
          </h1>
          <div class="navbar-nav flex-row">
            <div class="nav-item">
              <a href="../pets/index.html" class="nav-link px-3">Pets</a>
            </div>
            <div class="nav-item">
              <a href="../pet_types/index.html" class="nav-link px-3"
                >Pet Types</a
              >
            </div>
            <div class="nav-item">
              <a href="../pet_states/index.html" class="nav-link px-3"
                >Pet States</a
              >
            </div>
            <div class="nav-item">
              <a href="../owners/index.html" class="nav-link px-3 active"
                >Dueños</a
              >
            </div>
          </div>
          <div class="navbar-nav flex-row order-md-last">
            <div class="nav-item">
              <a href="#" class="nav-link d-flex lh-1 text-reset p-0">
                <img
                  src="../assets/images/icon-user.svg"
                  alt="User Icon"
                  width="24"
                  height="24"
                />
                <div class="d-none d-xl-block ps-2">
                  <div id="navbar-user-email">-</div>
                  <div class="mt-1 small text-secondary">Administrator</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </header>
      <!-- Content -->
      <div class="page-wrapper">
        <div class="page-body">
          <div class="container-xl">
            <!-- Spinner -->
            <div id="loading-spinner" class="text-center my-4">
              <div class="spinner-border" role="status"></div>
            </div>
            <!-- Tarjeta de tabla -->
            <div id="card-table-entity" class="card" style="display: none">
              <div class="card-body">
                <table
                  id="table-entity"
                  class="display compact"
                  style="width: 100%"
                >
                  <thead></thead>
                  <tbody>
                    <!-- Los datos serán llenados dinámicamente desde Supabase -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para agregar/editar propietario -->
    <div
      class="modal fade"
      id="modal-add-entity"
      tabindex="-1"
      aria-labelledby="modal-add-entity-label"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-add-entity-label">
              Agregar Dueño
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
              id="modal-add-entity-button-close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="form-new-entity">
              <div class="mb-3">
                <label for="form-new-entity-field-dni" class="form-label"
                  >DNI</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="form-new-entity-field-dni"
                  name="dni"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="form-new-entity-field-name" class="form-label"
                  >Nombre</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="form-new-entity-field-name"
                  name="name"
                  required
                />
              </div>
              <div class="mb-3">
                <label
                  for="form-new-entity-field-contact-data"
                  class="form-label"
                  >Datos de Contacto</label
                >
                <textarea
                  class="form-control"
                  id="form-new-entity-field-contact-data"
                  name="contact_data"
                  rows="3"
                ></textarea>
              </div>
              <button type="submit" class="btn btn-primary">
                Guardar Dueño
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de Confirmación de Eliminación -->
    <div
      class="modal fade"
      id="modal-delete-entity"
      tabindex="-1"
      aria-labelledby="modal-delete-entity-label"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-delete-entity-label">
              Confirmar Eliminación
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
              id="modal-delete-entity-button-close"
            ></button>
          </div>
          <div class="modal-body">
            ¿Estás seguro de que deseas eliminar este dueño? Esta acción no se
            puede deshacer.
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="modal-delete-entity-button-confirm"
            >
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta17/dist/js/tabler.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.4/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
